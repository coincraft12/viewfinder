<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viewfinder 원격 보기</title>
<style>
  :root {
    --bg: #0c0d0f;
    --text: #e7e9ec;
    --text-dim: #9098a3;
    --accent: #e0402c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: 0.02em; }
  .status {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim);
  }
  .dot.live { background: #33c07a; box-shadow: 0 0 8px #33c07a; }
  .dot.err { background: var(--accent); }
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px 12px;
  }
  video {
    width: 100%;
    max-width: 900px;
    border-radius: 10px;
    background: #000;
  }
  .msg {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 0 20px;
  }
  .token-form {
    max-width: 320px;
    margin: 80px auto;
    padding: 20px;
    background: #16181c;
    border-radius: 12px;
    text-align: center;
  }
  .token-form input {
    width: 100%;
    padding: 10px;
    margin: 12px 0;
    border-radius: 8px;
    border: 1px solid #2a2d33;
    background: #0c0d0f;
    color: var(--text);
    font-size: 14px;
  }
  .token-form button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .clips-section {
    padding: 4px 16px 28px;
  }
  .clips-section h2 {
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 10px;
  }
  .clip-player {
    margin-bottom: 12px;
    padding: 10px;
    border-radius: 10px;
    background: #16181c;
  }
  .clip-player video {
    width: 100%;
    max-width: none;
    display: block;
  }
  .clip-player button {
    margin-top: 8px;
    padding: 6px 12px;
    font-size: 12.5px;
    border: none;
    border-radius: 6px;
    background: #2a2d33;
    color: var(--text);
    cursor: pointer;
  }
  .clip-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .clip-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    background: #16181c;
  }
  .clip-row .time { font-size: 13px; }
  .clip-row .dur { font-size: 11.5px; color: var(--text-dim); }
  .clip-row button {
    padding: 6px 14px;
    font-size: 12.5px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .clip-list .empty {
    font-size: 12.5px;
    color: var(--text-dim);
    font-style: italic;
  }
</style>
</head>
<body>
  <header>
    <h1>Viewfinder 원격 보기</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">연결 대기</span></div>
  </header>
  <div class="stage" id="stage">
    <p class="msg">연결 중…</p>
  </div>

  <div class="clips-section">
    <h2>저장된 클립</h2>
    <div class="clip-player" id="clipPlayer" hidden>
      <video id="clipPlayerVideo" controls autoplay></video>
      <button type="button" id="clipPlayerClose">닫기</button>
    </div>
    <div class="clip-list" id="clipList">
      <span class="empty">불러오는 중…</span>
    </div>
  </div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  let token = params.get('token') || localStorage.getItem('viewfinder.remoteToken') || '';

  const stage = document.getElementById('stage');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');

  function setStatus(text, cls) {
    statusText.textContent = text;
    dot.className = 'dot' + (cls ? ' ' + cls : '');
  }

  function showTokenForm() {
    stage.innerHTML = `
      <div class="token-form">
        <div>보고 있는 카메라의 토큰을 입력하세요</div>
        <input type="text" id="tokenInput" placeholder="토큰 붙여넣기" />
        <button id="tokenSubmit">연결</button>
      </div>
    `;
    document.getElementById('tokenSubmit').addEventListener('click', () => {
      const v = document.getElementById('tokenInput').value.trim();
      if (!v) return;
      localStorage.setItem('viewfinder.remoteToken', v);
      location.search = `?token=${encodeURIComponent(v)}`;
    });
  }

  if (!token) {
    showTokenForm();
    return;
  }
  localStorage.setItem('viewfinder.remoteToken', token);

  stage.innerHTML = '<p class="msg">브로드캐스터(카메라) 연결 대기 중…</p>';

  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${wsProto}//${location.host}/viewfinder-signal?role=viewer&token=${encodeURIComponent(token)}`);

  let viewerId = null;
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

  pc.ontrack = (e) => {
    stage.innerHTML = '<video id="remoteVideo" autoplay playsinline controls></video>';
    document.getElementById('remoteVideo').srcObject = e.streams[0];
    setStatus('연결됨', 'live');
  };
  pc.oniceconnectionstatechange = () => {
    if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
      setStatus('연결 끊김', 'err');
    }
  };
  pc.onicecandidate = (e) => {
    if (e.candidate && viewerId) {
      ws.send(JSON.stringify({ type: 'ice', viewerId, data: e.candidate }));
    }
  };

  ws.addEventListener('open', () => setStatus('시그널링 연결됨'));
  ws.addEventListener('close', () => {
    setStatus('연결 끊김 — 재접속 중…', 'err');
    // 프록시가 idle 연결을 끊는 경우 대비 — 페이지 새로고침으로 깔끔하게 재연결
    setTimeout(() => location.reload(), 2000);
  });
  ws.addEventListener('error', () => setStatus('시그널링 오류', 'err'));

  ws.addEventListener('message', async (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }

    if (msg.type === 'joined') {
      viewerId = msg.viewerId;
    } else if (msg.type === 'offer') {
      await pc.setRemoteDescription(msg.data);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: 'answer', viewerId, data: answer }));
      setStatus('영상 연결 중…');
    } else if (msg.type === 'ice') {
      try { await pc.addIceCandidate(msg.data); } catch {}
    }
  });

  // ── 저장된 클립 목록 ──────────────────────────────────────────────
  const clipList = document.getElementById('clipList');
  const clipPlayer = document.getElementById('clipPlayer');
  const clipPlayerVideo = document.getElementById('clipPlayerVideo');
  document.getElementById('clipPlayerClose').addEventListener('click', () => {
    clipPlayerVideo.pause();
    clipPlayerVideo.removeAttribute('src');
    clipPlayer.hidden = true;
  });

  function formatBytes(n) {
    if (n === null || n === undefined) return '';
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toFixed(0)} KB`;
    return `${(n / (1024 * 1024)).toFixed(1)} MB`;
  }

  function playClip(path) {
    clipPlayerVideo.src = `/viewfinder-file?path=${encodeURIComponent(path)}&token=${encodeURIComponent(token)}`;
    clipPlayer.hidden = false;
    clipPlayer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    // 녹화가 정상적으로 끝난 파일은 헤더에 정확한 길이가 있음 — 그런 파일까지 끝으로 탐색했다 되돌아오면
    // 오히려 재생이 도중에 멈추므로, duration이 진짜 이상할 때(Infinity/NaN/0)만 재계산 시도
    clipPlayerVideo.addEventListener('loadedmetadata', () => {
      const d = clipPlayerVideo.duration;
      if (d === 0 || !Number.isFinite(d)) {
        clipPlayerVideo.currentTime = 1e9;
        clipPlayerVideo.addEventListener('timeupdate', function fixDuration() {
          clipPlayerVideo.removeEventListener('timeupdate', fixDuration);
          clipPlayerVideo.currentTime = 0;
        }, { once: true });
      }
    }, { once: true });
  }

  function renderClip(clip) {
    const row = document.createElement('div');
    row.className = 'clip-row';
    const ts = clip.modified ? new Date(clip.modified) : null;
    const label = clip.path.replace(/^viewfinder-motion\//, '');
    row.innerHTML = `
      <div>
        <div class="time">${ts ? ts.toLocaleString() : clip.name}</div>
        <div class="dur">${formatBytes(clip.size)} · ${label}</div>
      </div>
      <button type="button">재생</button>
    `;
    row.querySelector('button').addEventListener('click', () => playClip(clip.path));
    clipList.appendChild(row);
  }

  async function loadClips() {
    try {
      const res = await fetch(`/viewfinder-clips?token=${encodeURIComponent(token)}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'unknown error');
      clipList.innerHTML = '';
      if (data.clips.length === 0) {
        clipList.innerHTML = '<span class="empty">아직 클립이 없습니다.</span>';
      } else {
        data.clips.forEach(renderClip);
      }
    } catch (err) {
      clipList.innerHTML = `<span class="empty">클립 목록을 불러오지 못했습니다 (${err.message || err})</span>`;
    }
  }
  loadClips();
})();
</script>
</body>
</html>
